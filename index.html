<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>🧬 PhysicLab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0f1a;color:#fff;font-family:'Segoe UI',system-ui;padding:0.8rem;display:flex;justify-content:center;align-items:center;min-height:100vh}
        .container{max-width:720px;width:100%;margin:auto;background:#0e1422;border-radius:2rem;border:1px solid #f5a623;overflow:hidden;box-shadow:0 10px 30px -8px #000}
        .gold-line{height:2px;background:linear-gradient(90deg,transparent,#f5a623,transparent);margin:10px 0;border:none}
        .header{display:flex;align-items:center;justify-content:space-between;padding:0.8rem 1rem;background:#0b0f1a;border-bottom:3px solid #f5a623;gap:8px;flex-wrap:wrap}
        .qr-code{width:50px;height:50px;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
        .qr-code img{width:44px;height:44px}
        .title-section{text-align:center;flex:1}
        .title-fixed{font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,#ffe6b0,#f5a623);background-clip:text;-webkit-background-clip:text;color:transparent;cursor:default;user-select:none}
        .title-translated{font-size:0.8rem;color:#b9c7d9;min-height:1.2rem}
        .main-icon{font-size:2rem;color:#f5a623;cursor:pointer;width:44px;text-align:center;transition:0.3s;user-select:none}
        .main-icon:active{transform:scale(0.9)}
        .info-strip{display:flex;justify-content:space-between;align-items:center;background:#00000055;padding:4px 10px;font-size:0.65rem;flex-wrap:wrap;gap:4px}
        .lang-device{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
        .lang-select{background:#1e2a3a;border:1px solid #f5a623;border-radius:40px;padding:2px 8px;color:#fff;font-size:0.7rem;max-width:260px;cursor:pointer}
        .device-id{background:#1e2a3a;border-radius:40px;padding:2px 10px;font-family:monospace;font-size:0.65rem}
        .free-badge{text-align:center;background:#f5a62320;margin:8px 12px;padding:6px;border-radius:40px;font-weight:bold;color:#f5a623;font-size:0.9rem}
        .credit-card{background:#0f172a;border-radius:1.5rem;margin:8px 12px;padding:12px;text-align:center;border:1px solid #3b82f6}
        .credit-amount{font-size:1.8rem;font-weight:800;color:#f5a623}
        .pay-buttons{display:flex;gap:8px;justify-content:center;margin:6px 0;flex-wrap:wrap}
        .pay-btn{background:#10b981;border:none;border-radius:60px;padding:5px 12px;font-weight:bold;cursor:pointer;color:#fff;font-size:0.75rem}
        .pay-btn:active{transform:scale(0.95)}
        .license-box{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}
        .license-box input{background:#1e2a3a;border:1px solid #3b82f6;border-radius:60px;padding:4px 10px;color:#fff;width:130px;font-size:0.7rem}
        .license-box button{background:#3b82f6;border:none;border-radius:60px;padding:4px 14px;cursor:pointer;font-weight:bold;color:#fff;font-size:0.7rem}
        .license-box button:active{transform:scale(0.95)}
        .admin-only{display:none;margin-top:6px;font-size:0.6rem;background:#1e293b;border-radius:20px;padding:4px 8px;text-align:center}

        .hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;padding:16px;margin:10px 0}
        .wing-card{background:#1e2a3e;border:2px solid #2a3a5a;border-radius:1.5rem;padding:12px;text-align:center;cursor:pointer;transition:0.2s;color:#fff}
        .wing-card:hover{border-color:#f5a623;transform:translateY(-3px);box-shadow:0 8px 25px rgba(245,166,35,0.15)}
        .wing-card .wing-icon{font-size:2.4rem;margin-bottom:4px}
        .wing-card .wing-title{font-weight:bold;font-size:0.9rem}
        .wing-card .wing-desc{font-size:0.6rem;color:#94a3b8;margin-top:2px}
        .wing-card .wing-action{font-size:0.55rem;color:#f5a623;margin-top:4px}
        #labPanel{display:none;padding:0 12px}
        .back-to-hub{background:#555;border:none;border-radius:40px;padding:8px 16px;color:#fff;cursor:pointer;font-weight:bold;margin:10px 0;width:100%;font-size:0.9rem;transition:0.2s}
        .back-to-hub:hover{background:#777}
        .advisor-box{background:#1e293b;border-radius:1.5rem;margin:12px 0;padding:12px 16px;border:2px solid #f5a623;font-size:0.9rem;color:#f5a623;display:flex;align-items:center;gap:10px;min-height:60px;word-break:break-word}
        .advisor-box i{font-size:1.8rem;flex-shrink:0}
        .advisor-box span{display:block;line-height:1.4}
        .wing-selector-area{display:flex;gap:10px;padding:8px 0;flex-wrap:wrap;align-items:center}
        .wing-selector-area label{font-size:0.75rem;color:#b9c7d9;display:flex;align-items:center;gap:6px;white-space:nowrap}
        .wing-selector-area select{background:#1e2a3a;border:1px solid #f5a623;border-radius:40px;padding:6px 12px;color:#fff;font-size:0.75rem;cursor:pointer;flex:1;min-width:80px}
        .sensor-container{background:#0f172a;border-radius:1.5rem;padding:12px;margin:12px 0;border:1px solid #2a3a5a;transition:0.3s}
        .sensor-container.active{border-color:#f5a623}
        .sensor-container .sensor-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
        .sensor-container .sensor-header .sensor-name{font-weight:bold;font-size:0.85rem;display:flex;align-items:center;gap:6px}

        .result-area{background:#0a1020;border-radius:1.5rem;margin:10px 0;padding:14px;border:2px solid #f5a623;display:none}

        .action-buttons{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

        .share-buttons{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
        .share-btn{background:#1e293b;border:1px solid #f5a623;border-radius:40px;padding:4px 12px;cursor:pointer;font-size:0.65rem;display:inline-flex;align-items:center;gap:4px;color:#fff;transition:0.2s}

        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f97316;padding:4px 14px;border-radius:30px;opacity:0;transition:0.2s;z-index:999;font-weight:bold;color:#000;font-size:0.8rem;pointer-events:none}

        .secret-modal-content .confirm-btn:hover{transform:scale(1.02)}
        .secret-modal-content .confirm-btn:active{transform:scale(0.95)}
        .secret-modal-content .close-btn{background:#555;border:none;border-radius:40px;padding:10px 20px;font-weight:bold;color:#fff;cursor:pointer;width:100%;margin-top:8px;font-size:0.9rem}
        .secret-modal-content .close-btn:hover{background:#777}
        .security-lock{font-size:3rem;margin-bottom:8px;color:#f5a623}
        .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:0.65rem;font-weight:bold}
        .badge-green{background:#10b98133;color:#10b981;border:1px solid #10b981}
        .badge-yellow{background:#f59e0b33;color:#f59e0b;border:1px solid #f59e0b}
        .badge-red{background:#ef444433;color:#ef4444;border:1px solid #ef4444}
        .layer-path{font-size:0.55rem;color:#6c7a92;margin-top:6px;padding-top:4px;border-top:1px solid #1e293b}
        @media(max-width:480px){.sensor-container .sensor-header{flex-direction:column;align-items:stretch}}
    </style>

<body>

<script>
// ============================================================
// 🧬 PhysicLab – الإصدار الجامع النهائي مع 23 لغة كاملة
// ============================================================
// - 6 أجنحة: محرك، زيت، معادن، صحة، خرسانة، منزل
// - لكل جناح حساساته الخاصة
// - 23 لغة يدوية (تعمل بدون إنترنت) - جميعها مفعلة
// - الكاميرا تعرض تفسير لوني بدلاً من نسبة مئوية
// - بصمة تشغيلية (نقر مزدوج على الساعة)
// - نظام رصيد ودفع (روابط Gumroad محدثة)
// - حزمة أمنية (طبقات OSI + توقيع رقمي للقراءات)
// - قراءة متكررة 3 مرات لكل حساس
// ============================================================

// ============================================================
// 1. الأمان والرصيد
// ============================================================
var STATIC_PASSWORD = 'MOULOUD2026';
var freeUsed = parseInt(localStorage.getItem('physicLabFree') || '0');
var admin = false;

function getDynamicPassword() {
    try {
        var today = new Date();
        var day = today.getDate().toString().padStart(2, '0');
        var month = (today.getMonth() + 1).toString().padStart(2, '0');
        var year = today.getFullYear();
        var base = year + month + day;
        var key = 42;
        var result = '';
        for (var i = 0; i < base.length; i++) {
            var charCode = base.charCodeAt(i) ^ key;
            result += String.fromCharCode(charCode);
        }
        return btoa(result).replace(/=/g, '');
    } catch (e) { return 'MOULOUD2026'; }
}

function generateSignature(value) {
    var str = value + 'PhysicLab-2026-S3cur3!';
    var hash = 0;
    for (var i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash = hash & hash;
    }
    return hash.toString(36);
}

function getSecureBalance() {
    try {
        var stored = localStorage.getItem('physicLabBalance');
        var sig = localStorage.getItem('physicLabBalanceSig');
        if (!stored) return 0;
        var value = parseInt(stored) || 0;
        if (!sig || generateSignature(value) !== sig) {
            localStorage.removeItem('physicLabBalance');
            localStorage.removeItem('physicLabBalanceSig');
            return 0;
        }
        return value;
    } catch (e) { return 0; }
}

function setSecureBalance(value) {
    var safeValue = Math.max(0, parseInt(value) || 0);
    localStorage.setItem('physicLabBalance', safeValue.toString());
    localStorage.setItem('physicLabBalanceSig', generateSignature(safeValue));
    return safeValue;
}

function showToast(msg) {
    var el = document.getElementById('toast');
    el.innerText = msg;
    el.classList.add('show');
    clearTimeout(el._hide);
    el._hide = setTimeout(function() { el.classList.remove('show'); }, 3000);
}

function totalCredits() {
    if (admin) return 9999;
    return Math.max(0, 3 - freeUsed) + getSecureBalance();
}

function updateCreditsUI() {
    var total = totalCredits();
    document.getElementById('creditValue').innerText = total;
    var left = Math.max(0, 3 - freeUsed);
    // ✅ التعديل المطلوب: استخدام الترجمة بدلاً من النص الثابت
    document.getElementById('freeBadge').innerHTML = t('free_badge', {count: left});
    document.getElementById('adminSection').style.display = admin ? 'block' : 'none';
}

function consumeCredit() {
    if (admin) return true;
    var left = Math.max(0, 3 - freeUsed);
    if (left > 0) {
        freeUsed++;
        localStorage.setItem('physicLabFree', freeUsed);
        updateCreditsUI();
        showToast('✅ تم خصم تشخيص');
        return true;
    }
    var balance = getSecureBalance();
    if (balance > 0) {
        setSecureBalance(balance - 1);
        updateCreditsUI();
        showToast('✅ تم خصم تشخيص');
        return true;
    }
    showToast('❌ لا رصيد كافٍ');
    return false;
}

// ============================================================
// 2. الحساسات الفعلية (مع قراءة متكررة 3 مرات)
// ============================================================
var sensorStates = {};

function readWithRetry(readerFn, sensorId, retries) {
    retries = retries || 3;
    return new Promise(function(resolve) {
        var results = [];
        var count = 0;
        function doRead() {
            readerFn(sensorId).then(function(result) {
                if (result.status === 'success') {
                    results.push(result.data);
                }
                count++;
                if (count < retries) {
                    setTimeout(doRead, 200);
                } else {
                    if (results.length === 0) {
                        resolve({ status: 'error', message: '❌ فشل القياس بعد ' + retries + ' محاولات' });
                    } else {
                        var avg = {};
                        var keys = Object.keys(results[0]);
                        keys.forEach(function(k) {
                            if (typeof results[0][k] === 'number') {
                                var sorted = results.map(function(r) { return r[k]; }).sort(function(a,b) { return a-b; });
                                var mid = sorted.slice(1, sorted.length-1);
                                if (mid.length === 0) mid = sorted;
                                var sum = mid.reduce(function(a,b) { return a+b; }, 0);
                                avg[k] = sum / mid.length;
                            } else {
                                avg[k] = results[0][k];
                            }
                        });
                        resolve({ status: 'success', data: avg });
                    }
                }
            });
        }
        doRead();
    });
}

function readCamera(sensorId) {
    return new Promise(function(resolve) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            resolve({ status: 'error', message: '❌ الكاميرا غير مدعومة' });
            return;
        }
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 320, height: 240 } })
            .then(function(stream) {
                var video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.playsInline = true;
                video.onloadedmetadata = function() {
                    var canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth || 320;
                    canvas.height = video.videoHeight || 240;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    var data = imageData.data;
                    var r = 0, g = 0, b = 0;
                    for (var i = 0; i < data.length; i += 4) {
                        r += data[i];
                        g += data[i+1];
                        b += data[i+2];
                    }
                    var total = data.length / 4;
                    var avgR = Math.round(r / total);
                    var avgG = Math.round(g / total);
                    var avgB = Math.round(b / total);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                    resolve({
                        status: 'success',
                        data: { rgb: [avgR, avgG, avgB], image: canvas.toDataURL('image/jpeg', 0.7) }
                    });
                };
                video.onerror = function() {
                    stream.getTracks().forEach(function(t) { t.stop(); });
                    resolve({ status: 'error', message: '❌ فشل في تشغيل الكاميرا' });
                };
                setTimeout(function() {
                    stream.getTracks().forEach(function(t) { t.stop(); });
                    resolve({ status: 'error', message: '❌ انتهت مهلة الكاميرا' });
                }, 8000);
            })
            .catch(function() {
                resolve({ status: 'error', message: '❌ رفض الإذن للكاميرا' });
            });
    });
}

function readMicrophone(sensorId) {
    return new Promise(function(resolve) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            resolve({ status: 'error', message: '❌ الميكروفون غير مدعوم' });
            return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                var audioContext = new (window.AudioContext || window.webkitAudioContext)();
                var source = audioContext.createMediaStreamSource(stream);
                var analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                source.connect(analyser);
                var dataArray = new Uint8Array(analyser.frequencyBinCount);
                var maxFreq = 0;
                var maxAmp = 0;
                for (var i = 0; i < 20; i++) {
                    analyser.getByteFrequencyData(dataArray);
                    for (var j = 0; j < dataArray.length; j++) {
                        if (dataArray[j] > maxAmp) {
                            maxAmp = dataArray[j];
                            maxFreq = (j / analyser.fftSize) * audioContext.sampleRate;
                        }
                    }
                }
                source.disconnect();
                audioContext.close();
                stream.getTracks().forEach(function(t) { t.stop(); });
                if (maxFreq > 0) {
                    resolve({ status: 'success', data: { frequency: Math.round(maxFreq), amplitude: maxAmp } });
                } else {
                    resolve({ status: 'error', message: '❌ لم يتم اكتشاف إشارة صوتية واضحة' });
                }
            })
            .catch(function() {
                resolve({ status: 'error', message: '❌ رفض الإذن للميكروفون' });
            });
    });
}

function readAccelerometer(sensorId) {
    return new Promise(function(resolve) {
        if (!window.DeviceMotionEvent) {
            resolve({ status: 'error', message: '❌ حساس الاهتزاز غير مدعوم' });
            return;
        }
        var samples = [];
        var handler = function(event) {
            var acc = event.accelerationIncludingGravity;
            if (acc) {
                var mag = Math.sqrt((acc.x || 0) ** 2 + (acc.y || 0) ** 2 + (acc.z || 0) ** 2);
                samples.push(mag);
            }
        };
        window.addEventListener('devicemotion', handler);
        setTimeout(function() {
            window.removeEventListener('devicemotion', handler);
            if (samples.length === 0) {
                resolve({ status: 'error', message: '❌ لم يتم استقبال إشارة من حساس الاهتزاز' });
                return;
            }
            var avg = samples.reduce(function(a, b) { return a + b; }, 0) / samples.length;
            resolve({ status: 'success', data: { magnitude: parseFloat(avg.toFixed(2)) } });
        }, 2000);
    });
}

function readMagnetometer(sensorId) {
    return new Promise(function(resolve) {
        if (!window.DeviceMotionEvent) {
            resolve({ status: 'error', message: '❌ حساس المغناطيسية غير مدعوم' });
            return;
        }
        var samples = [];
        var handler = function(event) {
            var mag = event.webkitCompassHeading;
            if (mag !== undefined && mag !== null) {
                samples.push(mag);
            }
        };
        window.addEventListener('devicemotion', handler);
        setTimeout(function() {
            window.removeEventListener('devicemotion', handler);
            if (samples.length === 0) {
                resolve({ status: 'error', message: '❌ لم يتم استقبال إشارة من حساس المغناطيسية' });
                return;
            }
            var avg = samples.reduce(function(a, b) { return a + b; }, 0) / samples.length;
            resolve({ status: 'success', data: { heading: parseFloat(avg.toFixed(1)) } });
        }, 2000);
    });
}

function readThermal(sensorId) {
    return new Promise(function(resolve) {
        if (!navigator.getBattery) {
            resolve({ status: 'error', message: '❌ حساس الحرارة غير مدعوم' });
            return;
        }
        navigator.getBattery()
            .then(function(battery) {
                var temp = 25 + (1 - battery.level) * 15;
                resolve({ status: 'success', data: { temperature: parseFloat(temp.toFixed(1)) } });
            })
            .catch(function() {
                resolve({ status: 'error', message: '❌ تعذر قراءة حرارة البطارية' });
            });
    });
}

function readSensor(sensorId) {
    var def = sensorDefs[sensorId];
    if (!def) return Promise.resolve({ status: 'error', message: 'حساس غير معروف' });
    return readWithRetry(def.reader, sensorId, 3);
}

function t(key, vars) {
    var langData = translations[currentLang] || translations['en'];
    var str = langData[key] || translations['en'][key] || key;
    if (vars) {
        for (var k in vars) {
            str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
        }
    }
    return str;
}

// ============================================================
// 5. تفسير لون الكاميرا (بدلاً من النسبة المئوية)
// ============================================================
function interpretCameraColor(rgb) {
    if (!rgb || rgb.length < 3) return t('no_signal');
    var r = rgb[0], g = rgb[1], b = rgb[2];
    
    // تحويل إلى أسماء ألوان مفهومة فيزيائياً
    if (r > 200 && g > 180 && b < 100) {
        return t('camera_golden');
    } else if (r < 80 && g < 80 && b < 80) {
        return t('camera_dark');
    } else if (r > 200 && g > 200 && b > 200) {
        return t('camera_light');
    } else if (r > 150 && g > 150 && b < 130 && b > 80) {
        return t('camera_gray');
    } else if (b > r && b > g && r < 150) {
        return t('camera_blue');
    } else if (r > 200 && g > 200 && b > 180 && r < 230) {
        return t('camera_white');
    } else if (r > 150 && r < 200 && g > 100 && g < 160 && b < 80) {
        return t('camera_brown');
    } else if (r > 180 && g > 120 && g < 170 && b < 60) {
        return t('camera_brown');
    } else {
        // حالة افتراضية: نحدد بناءً على السطوع النسبي
        var brightness = (r + g + b) / 3;
        if (brightness > 200) return t('camera_light');
        else if (brightness < 60) return t('camera_dark');
        else if (r > g && r > b) return '🟠 لون محمر (حرارة أو أكسدة)';
        else if (g > r && g > b) return '🟢 لون مخضر (رطوبة أو نمو طحلبي)';
        else return '🔵 لون مزرق (تبخر أو تفاعل كيميائي)';
    }
}

function renderWings() {
    var grid = document.getElementById('wingGrid');
    grid.innerHTML = '';
    wings.forEach(function(wing) {
        var card = document.createElement('div');
        card.className = 'wing-card';
        card.dataset.wing = wing.id;
        card.innerHTML = `
            <div class="wing-icon">${wing.icon}</div>
            <div class="wing-title">${t(wing.titleKey)}</div>
            <div class="wing-desc">${t(wing.descKey)}</div>
            <div class="wing-action">${t('start')}</div>
        `;
        card.onclick = function() { selectWing(wing.id); };
        grid.appendChild(card);
    });
}

function selectWing(wingId) {
    currentWing = wings.find(function(w) { return w.id === wingId; });
    if (!currentWing) return;
    currentSubType = currentWing.subTypes[0] || 'general';
    document.getElementById('hubContainer').style.display = 'none';
    document.getElementById('labPanel').style.display = 'block';
    document.getElementById('resultPanel').style.display = 'none';
    document.getElementById('advisorText').innerHTML = '🔍 ' + t(currentWing.titleKey) + ': ' + t(currentWing.descKey);
    buildSubSelect();
    renderSensors(currentWing.sensors);
    activeSensors = {};
    sensorReadings = {};
    document.getElementById('analyzeBtn').disabled = true;
}

function buildSubSelect() {
    var sel = document.getElementById('wingSubSelect');
    sel.innerHTML = '';
    currentWing.subTypes.forEach(function(st, idx) {
        var opt = document.createElement('option');
        opt.value = st;
        var key = currentWing.subKeys ? currentWing.subKeys[idx] : st;
        opt.textContent = t(key);
        if (st === currentSubType) opt.selected = true;
        sel.appendChild(opt);
    });
    sel.onchange = function() {
        currentSubType = this.value;
        showToast('✅ ' + t('success'));
    };
    document.getElementById('wingSelectorArea').style.display = 'flex';
}

function renderSensors(sensorIds) {
    var container = document.getElementById('sensorsContainer');
    container.innerHTML = '';
    sensorIds.forEach(function(id) {
        var def = sensorDefs[id];
        if (!def) return;
        var div = document.createElement('div');
        div.className = 'sensor-container';
        div.id = 'sensor_' + def.id;
        div.innerHTML = `
            <div class="sensor-header">
                <div class="sensor-name"><span>${def.icon}</span> ${t(def.labelKey)}</div>
                <div class="controls">
                    <button class="btn-start" data-sensor="${def.id}" onclick="startSensor('${def.id}')">${t('start')}</button>
                    <button class="btn-stop" data-sensor="${def.id}" onclick="stopSensor('${def.id}')" disabled>${t('stop')}</button>
                </div>
            </div>
            <div class="sensor-display" id="display_${def.id}">${t('waiting')}</div>
        `;
        container.appendChild(div);
    });
}

function startSensor(sensorId) {
    var def = sensorDefs[sensorId];
    if (!def) return;
    var startBtn = document.querySelector('#sensor_' + sensorId + ' .btn-start');
    var stopBtn = document.querySelector('#sensor_' + sensorId + ' .btn-stop');
    var display = document.getElementById('display_' + sensorId);
    if (!startBtn || !stopBtn || !display) return;
    startBtn.disabled = true;
    stopBtn.disabled = true;
    display.innerHTML = t('measuring') + ' (3 محاولات)';
    readSensor(sensorId).then(function(result) {
        if (result.status === 'success') {
            var data = result.data;
            var html = '<span class="success">' + t('success') + '</span><br>';
            if (data.rgb) {
                var colorInterpretation = interpretCameraColor(data.rgb);
                html += '<span class="reading">' + colorInterpretation + '</span><br>';
                if (data.image) html += '<img src="' + data.image + '" alt="صورة">';
            }
            if (data.frequency) html += '<span class="reading">التردد: ' + data.frequency + ' هرتز</span>';
            if (data.magnitude) html += '<span class="reading">التسارع: ' + data.magnitude + ' م/ث²</span>';
            if (data.heading) html += '<span class="reading">الاتجاه: ' + data.heading + '°</span>';
            if (data.temperature) html += '<span class="reading">الحرارة: ' + data.temperature + ' °م</span>';
            display.innerHTML = html;
            sensorReadings[sensorId] = data;
            activeSensors[sensorId] = true;
            startBtn.disabled = false;
            stopBtn.disabled = false;
        } else {
            display.innerHTML = '<span class="error">' + result.message + '</span>';
            startBtn.disabled = false;
            stopBtn.disabled = true;
            activeSensors[sensorId] = false;
        }
        checkAllSensors();
    });
}

function stopSensor(sensorId) {
    var display = document.getElementById('display_' + sensorId);
    var startBtn = document.querySelector('#sensor_' + sensorId + ' .btn-start');
    var stopBtn = document.querySelector('#sensor_' + sensorId + ' .btn-stop');
    if (!display || !startBtn || !stopBtn) return;
    display.innerHTML = t('waiting');
    startBtn.disabled = false;
    stopBtn.disabled = true;
    activeSensors[sensorId] = false;
    delete sensorReadings[sensorId];
    checkAllSensors();
}

function checkAllSensors() {
    var hasReading = false;
    for (var key in sensorReadings) {
        if (sensorReadings[key]) { hasReading = true; break; }
    }
    document.getElementById('analyzeBtn').disabled = !hasReading;
}

function goBackToHub() {
    document.getElementById('hubContainer').style.display = 'block';
    document.getElementById('labPanel').style.display = 'none';
    document.getElementById('resultPanel').style.display = 'none';
    document.getElementById('sensorsContainer').innerHTML = '';
    document.getElementById('wingSelectorArea').style.display = 'none';
    document.getElementById('advisorText').innerHTML = t('advisor_select');
    activeSensors = {};
    sensorReadings = {};
}

// 7. التشخيص الفيزيائي مع تفسير الكاميرا
// ============================================================
function runDiagnosis() {
    if (!consumeCredit()) return;
    var readings = sensorReadings;
    var required = currentWing ? currentWing.sensors.length : 3;
    var count = Object.keys(readings).length;
    if (count < required) {
        showToast('⚠️ يرجى إكمال جميع الحساسات (' + required + ') للحصول على تشخيص دقيق. (بدون خصم)');
        return;
    }
    
    var parts = [];
    var confidence = 0;
    var status = 'good';
    var recommendation = '';
    
    if (readings.camera) {
        var rgb = readings.camera.rgb;
        var colorInterpretation = interpretCameraColor(rgb);
        parts.push('📸 ' + colorInterpretation);
        confidence += 20;
    }
    if (readings.microphone) {
        parts.push('🎤 ' + t('frequency') + ': ' + readings.microphone.frequency + ' هرتز');
        confidence += 25;
    }
    if (readings.accelerometer) {
        var mag = readings.accelerometer.magnitude;
        parts.push('📳 ' + t('acceleration') + ': ' + mag + ' م/ث²');
        if (mag > 8) { status = 'warning'; confidence += 15; }
        else { confidence += 25; }
    }
    if (readings.magnetometer) {
        parts.push('🧲 ' + t('heading') + ': ' + readings.magnetometer.heading + '°');
        confidence += 20;
    }
    if (readings.thermal) {
        var temp = readings.thermal.temperature;
        parts.push('🌡️ ' + t('temperature') + ': ' + temp + ' °م');
        if (temp > 45) { status = 'critical'; confidence += 10; }
        else { confidence += 20; }
    }
    
    confidence = Math.min(98, Math.round(confidence));
    var confidenceLevel = confidence > 80 ? t('confidence_high') : (confidence > 60 ? t('confidence_medium') : t('confidence_low'));
    
    var statusText = '';
    if (status === 'critical') {
        statusText = t('diagnosis_critical');
        recommendation = t('recommendation_' + (currentWing ? currentWing.id : 'engine'));
    } else if (status === 'warning') {
        statusText = t('diagnosis_warning');
        recommendation = t('recommendation_' + (currentWing ? currentWing.id : 'engine'));
    } else {
        statusText = t('diagnosis_good');
        recommendation = t('recommendation_' + (currentWing ? currentWing.id : 'engine'));
    }
    
    var resultText = '🔬 ' + statusText + '\n📊 ' + parts.join(' • ') + '\n📈 ' + t('confidence_level') + ': ' + confidence + '% (' + confidenceLevel + ')\n💡 ' + recommendation;
    
    var panel = document.getElementById('resultPanel');
    panel.innerHTML = `
        <div class="diagnosis-result">${resultText.replace(/\n/g, '<br>')}</div>
        <div class="layer-path">${t('path')}</div>
        <div class="action-buttons">
            <button class="action-btn" onclick="speakResult()">${t('listen')}</button>
            <button class="action-btn" onclick="copyResult()">${t('copy')}</button>
            <button class="action-btn" onclick="shareResult()">${t('share')}</button>
        </div>
    `;
    panel.style.display = 'block';
}

function speakResult() {
    var text = document.querySelector('.diagnosis-result')?.innerText || '';
    if (text) {
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = currentLang === 'ar' ? 'ar-SA' : 'en-US';
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
    }
}

function copyResult() {
    var text = document.querySelector('.diagnosis-result')?.innerText || '';
    if (text) {
        navigator.clipboard.writeText(text);
        showToast('✅ ' + t('copied'));
    }
}

function shareResult() {
    var text = document.querySelector('.diagnosis-result')?.innerText || '';
    if (text) {
        if (navigator.share) {
            navigator.share({ title: 'PhysicLab', text: text });
        } else {
            navigator.clipboard.writeText(text);
            showToast('✅ ' + t('shared'));
        }
    }
}
